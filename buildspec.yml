# AWS CodeBuild spec.
#
# An AWS-native alternative to the GitHub Actions workflows, for teams running
# CodePipeline instead. It performs the same gate - install, lint, typecheck,
# test, build, deploy - and expects the CodeBuild service role to carry the
# deployment permissions rather than assuming a separate role.
version: 0.2

env:
  variables:
    NODE_ENV: production
    STAGE: staging
  # Set AWS_REGION and STAGE as CodeBuild environment variables, or pass them
  # in as CodePipeline action overrides.

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - npm ci

  pre_build:
    commands:
      - echo "Linting"
      - npm run lint
      - echo "Typechecking"
      - npm run typecheck
      - echo "Testing"
      - npm test
      - echo "Auditing production dependencies"
      - npm audit --audit-level=high --omit=dev

  build:
    commands:
      - echo "Building server and web bundles"
      - npm run build
      - echo "Synthesizing the CDK stack"
      - npm run synth --workspace @wealth/infra

  post_build:
    commands:
      # Guard so a pull-request build validates without deploying anything.
      - |
        if [ "$CODEBUILD_WEBHOOK_EVENT" = "PULL_REQUEST_CREATED" ] || [ "$CODEBUILD_WEBHOOK_EVENT" = "PULL_REQUEST_UPDATED" ]; then
          echo "Pull-request build - skipping deploy."
          exit 0
        fi
      - echo "Deploying stage $STAGE"
      # Stack name is explicit: the app also defines the one-off GitHub deploy
      # role stack, which no pipeline should ever modify.
      - cd infra && npx cdk deploy "WealthNavigator-$STAGE" -c stage=$STAGE --require-approval never --outputs-file cdk-outputs.json
      - cat cdk-outputs.json

artifacts:
  files:
    - packages/server/dist/**/*
    - packages/web/dist/**/*
    - infra/cdk.out/**/*
    - infra/cdk-outputs.json
  name: wealth-navigator-$(date +%Y%m%d-%H%M%S)

cache:
  paths:
    - node_modules/**/*
    - packages/*/node_modules/**/*
